version: '3.8'

services:
  code-review-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - BITBUCKET_URL=${BITBUCKET_URL:-https://git.cnvrmedia.net/rest/api/1.0}
      - BITBUCKET_TOKEN=${BITBUCKET_TOKEN}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - code-review-agent
    restart: unless-stopped
