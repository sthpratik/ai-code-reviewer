[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-reviewer"
version = "1.0.0"
description = "AI-powered code review agent using AWS Bedrock and Bitbucket integration"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Manish Shrestha", email = "sth.pratik@gmail.com"}
]
keywords = ["code-review", "ai", "aws-bedrock", "bitbucket", "automation", "quality-assurance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "crewai>=0.1.0",
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
    "python-dotenv>=0.19.0",
    "pydantic>=1.8.0",
    "requests>=2.25.0",
    "boto3>=1.20.0",
    "PyYAML>=5.4.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "flake8>=3.8",
    "mypy>=0.800",
]
server = [
    "gunicorn>=20.0.0",
    "nginx",
]

[project.scripts]
ai-code-reviewer = "ai_code_reviewer.cli:main"
acr = "ai_code_reviewer.cli:main"

[project.urls]
Homepage = "https://github.com/sthpratik/ai-code-reviewer"
Documentation = "https://github.com/sthpratik/ai-code-reviewer/docs"
Repository = "https://github.com/sthpratik/ai-code-reviewer"
"Bug Tracker" = "https://github.com/sthpratik/ai-code-reviewer/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_code_reviewer*"]

[tool.setuptools.package-data]
ai_code_reviewer = ["config/*.yaml", "static/*", "templates/*"]
